    <text x="590.0000000000001" y="100" fill="#656d76" font-size="12" text-anchor="middle">Stars</text>
    <text x="716.6666666666667" y="75" fill="#1f2328" font-size="22" font-weight="700" text-anchor="middle">234</text>
    <text x="716.6666666666667" y="100" fill="#656d76" font-size="12" text-anchor="middle">Repos</text>
  </g>
  <g class="dark">
    <rect width="800" height="160" fill="#0d1117" rx="6" />
    
