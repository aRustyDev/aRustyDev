    <text x="83.33333333333334" y="100" fill="#656d76" font-size="12" text-anchor="middle">Commits</text>
    <text x="210.00000000000003" y="75" fill="#1f2328" font-size="22" font-weight="700" text-anchor="middle">729</text>
    <text x="210.00000000000003" y="100" fill="#656d76" font-size="12" text-anchor="middle">PRs</text>
