    <text x="336.6666666666667" y="100" fill="#656d76" font-size="12" text-anchor="middle">Reviews</text>
    <text x="463.3333333333333" y="75" fill="#1f2328" font-size="22" font-weight="700" text-anchor="middle">1.0k</text>
    <text x="463.3333333333333" y="100" fill="#656d76" font-size="12" text-anchor="middle">Issues</text>
