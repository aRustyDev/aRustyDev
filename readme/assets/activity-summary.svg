    <text x="210.00000000000003" y="75" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">729</text>
    <text x="210.00000000000003" y="100" fill="#8b949e" font-size="12" text-anchor="middle">PRs</text>
    <text x="336.6666666666667" y="75" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">3</text>
    <text x="336.6666666666667" y="100" fill="#8b949e" font-size="12" text-anchor="middle">Reviews</text>
