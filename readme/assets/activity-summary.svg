<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <style>
    .light { display: block; }
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: block; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <g class="light">
    <rect width="800" height="160" fill="#ffffff" rx="6" />
    
    <text x="20" y="30" fill="#1f2328" font-size="16" font-weight="600">GitHub Activity</text>
    <line x1="20" y1="42" x2="780" y2="42" stroke="#d0d7de" stroke-width="1" />
